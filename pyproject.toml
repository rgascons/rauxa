[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rauxa"
version = "0.1.0"
description = "Procedural generator of verifiable Catalan language tasks, with a reasoning-gym compatible interface."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
anthropic = ["anthropic"]

[project.scripts]
rauxa = "rauxa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rauxa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
