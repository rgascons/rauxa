# Anglicismes catalog — reviewed 2026-10-18. Used by src/rauxa/tasks/anglicismes.py, which adds
# the sentence frames, markers and LanguageTool rules for each accepted entry.
#
# Each entry has a review status: "accepted" (used by the anglicismes task), "rejected" (kept with
# `rejection_reason` so it isn't re-added from LanguageTool later) or "proposed" (awaiting a decision).
#
# Target register: formal Catalan, IEC norm.
#
# ASSESSMENT POLICY (confirmed in review, 2026-10-18)
#   normative_error  An authority (DIEC, Optimot, TERMCAT) states the form is inadequate; or the
#                    English form/sense is absent from DIEC AND an authority attests a Catalan
#                    term for the concept. Becomes `pair` items.
#   style_preference An authority admits both forms but recommends one for formal registers.
#                    Becomes `preference` items, never presented as an error.
#   accepted         DIEC or TERMCAT includes the form. Becomes `control` items.
#   disputed         Sources conflict. Not used for pairs until the reviewer decides.
#
# EVIDENCE LEVEL (how strong the case is, separate from the assessment)
#   explicit   An authority says so in words (quoted in `evidence`).
#   inferred   DIEC lacks the form/sense, a Catalan term is attested, and LanguageTool flags the
#              English one. No authority says "incorrect" in words.
#   disputed   At least one source points the other way (see `evidence`).
#
# English origin alone never makes a form an error: see the controls and the disputed entries.
#
# SOURCES AND REUSE
#   LanguageTool replace_anglicism.txt and grammar.xml at commit
#   38a903c9037cd04359cb92a13d94386ffb3eca30 (LGPL-2.1): used only to find candidates.
#   Optimot (Generalitat de Catalunya), which also serves DIEC2 and TERMCAT records: reuse is
#   allowed "sempre que se'n citi la font i la data d'actualització" (Llei 19/2014, art. 17.1).
#   We store record ids, short quotes and our own rationale, never copied example collections.
#   Retrieved 2026-10-17. Detail URL pattern:
#   https://aplicacions.llengua.gencat.cat/llc/AppJava/index.html?action=Principal&method=detall&database={DIEC|FITXES_PUB|TERMCAT}&idFont={id}&idHit={id}

[meta]
version = "0.1"
reviewed = "2026-10-18"
retrieved = "2026-10-17"
languagetool_commit = "38a903c9037cd04359cb92a13d94386ffb3eca30"

