# Fully LLM-generated: every pair is written by the writer model and judged by the judge
# model, with no template (procedural) source. Pairs are not correct by construction, so
# have a native speaker review a sample (`rauxa review`, `rauxa calibrate`) before using
# the dataset as a benchmark. To keep a guaranteed-correct base, add a
# `type = "procedural"` source (see castellanismes_procedural.toml).
#
# Run inside WSL/Linux with a supported, authenticated GitHub Copilot CLI.
# Set models available to your account before starting. See GETTING_STARTED.md.
# No machine-specific executable paths or credentials belong in this file.

[run]
name = "castellanismes_runners_llm_only_10k"
target_size = 10000
seed = 1
pool_multiplier = 1.2

[runners.copilot]
enabled = true
concurrency = 4
max_calls = 18000      # cumulative CLI invocations, including retries; safe to raise on resume

[[sources]]
type = "llm"
task = "castellanismes_verbals"
backend = "writer"
count = 16000          # LLM candidate budget, not final dataset size
batch_size = 15
max_fix_attempts = 2

[checks.languagetool]
enabled = true
url = "http://localhost:8081"

[judge]
enabled = true
backend = "judge"
mode = "filter"
source_types = ["llm"]
on_error = "reject"

[backends.writer]
type = "agent"
model = "gpt-6-astra"
timeout = 120
max_retries = 3       # total attempts per request

[backends.judge]
type = "agent"
model = "claude-sonnet-5.5"
timeout = 120
max_retries = 3

[min_share.phenomenon]
tenir_que = 0.2
hi_ha_que = 0.2
donar_se_compte = 0.2
